sonar.projectKey=mashbot
sonar.projectName=Mashbot
sonar.sourceEncoding=UTF-8

# Scan the whole frozen codebase (assignment requires this, not selected files).
sonar.sources=.
sonar.exclusions=node_modules/**,.next/**,out/**,build/**,coverage/**,public/**,*.md,package-lock.json

# sonar.host.url and sonar.token are passed on the command line (see docs/sonarqube-guide.md)
# so no secrets ever end up in this file / the git repo.
